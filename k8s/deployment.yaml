apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-web-app
  labels:
    app: maven-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maven-web-app
  template:
    metadata:
      labels:
        app: maven-web-app
    spec:
      containers:
        - name: maven-web-app
          image: krishnajune2000/maven-web-app:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: maven-web-app-svc
spec:
  type: LoadBalancer
  selector:
    app: maven-web-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
